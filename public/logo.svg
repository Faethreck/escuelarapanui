<svg width="220" height="260" viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
  <!-- Guitar pick shape - Dark blue upper 2/3 -->
  <path d="M 110 18 Q 195 60 195 150 Q 195 200 110 242 Q 25 200 25 150 Q 25 60 110 18 Z" fill="#1e3a5f"/>
  
  <!-- White lower 1/3 -->
  <path d="M 40 162 Q 50 210 110 232 Q 170 210 180 162 L 180 152 L 40 152 Z" fill="#ffffff"/>
  
  <!-- Moai statue (profile, facing right, more detailed and recognizable) -->
  <g transform="translate(110, 125)">
    <!-- Main head shape (elongated, characteristic Moai shape) -->
    <path d="M -35 -65 
             Q -38 -68 -38 -72 
             L -38 -75 
             Q -35 -78 -32 -78 
             L 32 -78 
             Q 35 -78 38 -75 
             L 38 -72 
             Q 38 -68 35 -65 
             L 35 -45 
             L 35 -35 
             L 30 -30 
             L 25 -25 
             L 20 -20 
             L -20 -20 
             L -25 -25 
             L -30 -30 
             L -35 -35 
             L -35 -45 
             Z" fill="#1e3a5f"/>
    
    <!-- Forehead/brow line -->
    <rect x="-38" y="-75" width="76" height="4" fill="#1e3a5f" opacity="0.8"/>
    
    <!-- Eyes (characteristic deep-set eyes of Moai) -->
    <ellipse cx="-18" cy="-60" rx="5" ry="8" fill="#1e3a5f" opacity="0.7"/>
    <ellipse cx="18" cy="-60" rx="5" ry="8" fill="#1e3a5f" opacity="0.7"/>
    
    <!-- Nose (long, prominent) -->
    <rect x="-5" y="-52" width="10" height="24" rx="5" fill="#1e3a5f"/>
    
    <!-- Mouth (thin, characteristic) -->
    <rect x="-14" y="-24" width="28" height="4" rx="2" fill="#1e3a5f"/>
    
    <!-- Chin/jaw -->
    <rect x="-32" y="-20" width="64" height="8" rx="4" fill="#1e3a5f"/>
    
    <!-- Body/torso (rectangular, narrower than head) -->
    <rect x="-28" y="-12" width="56" height="50" rx="5" fill="#1e3a5f"/>
    
    <!-- Base/platform (extends into white section) -->
    <rect x="-32" y="36" width="64" height="20" rx="5" fill="#1e3a5f"/>
    <rect x="-30" y="53" width="60" height="15" rx="4" fill="#1e3a5f"/>
  </g>
  
  <!-- Text: ESCUELA PARTICULAR (top, yellow, arched effect) -->
  <text x="110" y="38" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f4c430" text-anchor="middle" letter-spacing="0.5px">ESCUELA PARTICULAR</text>
  
  <!-- Text: Nº 371 (yellow) -->
  <text x="110" y="54" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f4c430" text-anchor="middle">Nº 371</text>
  
  <!-- Text: RAPA (left side, vertical, yellow) -->
  <text x="50" y="100" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f4c430" text-anchor="middle" transform="rotate(-90 50 100)" letter-spacing="2px">RAPA</text>
  
  <!-- Text: NUI (right side, vertical, yellow) -->
  <text x="170" y="100" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f4c430" text-anchor="middle" transform="rotate(90 170 100)" letter-spacing="2px">NUI</text>
  
  <!-- Text: Educando desde 1958 (bottom in white section, blue, italic) -->
  <text x="110" y="215" font-family="Georgia, serif" font-size="11" fill="#1e3a5f" text-anchor="middle" font-style="italic">Educando desde 1958</text>
</svg>
